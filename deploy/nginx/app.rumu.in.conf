# React SPA (app.rumu.in)
# Serve `frontend/dist` and fall back to index.html for client-side routes.

server {
    listen 80;
    server_name app.rumu.in;

    root /var/www/rumu/frontend/dist;
    index index.html;

    charset utf-8;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
